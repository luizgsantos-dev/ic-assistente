[project]
name = "ic-assistant"
version = "0.1.0"
description = "Assistente do Instituto de Computação da UFMT, baseado em RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.0.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.1",
    "typer>=0.15.1",
    "pymupdf>=1.25.1",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.2",
    "sentence-transformers>=3.3.1",
    "torch>=2.5.1",
    "pyyaml>=6.0.2",
    "tzdata>=2024.2",
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
]

[project.scripts]
ic = "app.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# torch só para CPU: o servidor não tem GPU e a build CUDA pesa vários GB.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que precisam do Postgres rodando (docker compose up db)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# A pasta backend/alembic (migrações) faz o ruff achar que alembic é módulo local.
known-third-party = ["alembic"]
